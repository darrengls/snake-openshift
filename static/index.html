<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake on OpenShift</title>
<style>
  :root {
    --bg: #0B0B0B;
    --surface: #151515;
    --surface-2: #1D1D1D;
    --border: #393939;
    --text: #FFFFFF;
    --muted: #B8B8B8;
    --dim: #8F8F8F;
    --accent: #FF7900;
    --food: #68D391;
    --danger: #FF5A5F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 14px;
    align-items: stretch;
    margin-bottom: 18px;
  }

  .bar { width: 10px; background: var(--accent); }

  h1 { margin: 0; font-size: 28px; }

  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .scores {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 15px;
  }

  .scores b { color: var(--accent); font-size: 18px; }

  .board {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1;
    margin-top: 10px;
    border: 2px solid var(--accent);
    background: var(--surface-2);
    touch-action: none;
  }

  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(11, 11, 11, 0.82);
    text-align: center;
    padding: 16px;
  }

  .overlay.hidden { display: none; }

  .overlay h2 { margin: 0; font-size: 26px; }

  .overlay p { margin: 0; color: var(--muted); }

  button {
    border: 0;
    background: var(--accent);
    color: var(--bg);
    font: bold 16px Arial, sans-serif;
    padding: 12px 28px;
    cursor: pointer;
  }

  button:hover { background: #E66D00; }

  .help { margin-top: 12px; color: var(--dim); font-size: 13px; text-align: center; }

  footer {
    margin-top: auto;
    padding-top: 20px;
    color: var(--dim);
    font-size: 12px;
    text-align: center;
  }

  footer code { color: var(--muted); }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
  }

  .dot.ok { background: var(--food); }
  .dot.ko { background: var(--danger); }
</style>
</head>
<body>
  <header>
    <div class="bar"></div>
    <div>
      <h1>Snake</h1>
      <p class="subtitle">A tiny game to test an OpenShift deployment.</p>
    </div>
  </header>

  <div class="scores">
    <span>Score <b id="score">0</b></span>
    <span>Pod best <b id="best">–</b></span>
  </div>

  <div class="board" id="board">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-text">Eat the green squares, avoid walls and your own tail.</p>
      <button id="start">Play</button>
    </div>
  </div>

  <p class="help">Arrows or WASD to move · Space to pause · Swipe on mobile</p>

  <footer>
    <span class="dot" id="status-dot"></span>
    Served by pod <code id="pod">…</code> · version <code id="version">…</code>
  </footer>

<script>
(() => {
  const GRID = 20;               // 20 x 20 cells
  const START_SPEED = 140;       // ms per step
  const MIN_SPEED = 60;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const cell = canvas.width / GRID;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayText = document.getElementById("overlay-text");
  const startBtn = document.getElementById("start");

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };

  let snake, dir, queue, food, score, speed, timer, running, paused;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function turn(name) {
    // Queue turns so two quick key presses are both applied, and
    // ignore a turn straight back into the snake's own neck.
    const last = queue.length ? queue[queue.length - 1] : dir;
    const next = DIRS[name];
    if (next.x === -last.x && next.y === -last.y) return;
    if (next === last) return;
    if (queue.length < 3) queue.push(next);
  }

  function step() {
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const ate = head.x === food.x && head.y === food.y;
    const body = ate ? snake : snake.slice(0, -1);

    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    const hitSelf = body.some(s => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);

    if (ate) {
      score += 1;
      scoreEl.textContent = score;
      if (snake.length === GRID * GRID) return gameOver(true);
      placeFood();
      speed = Math.max(MIN_SPEED, speed - 3);
      restartTimer();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = "#1D1D1D";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle grid
    ctx.strokeStyle = "#232323";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#68D391";
    ctx.fillRect(food.x * cell + 4, food.y * cell + 4, cell - 8, cell - 8);

    // Snake: head in bright orange, body slightly darker
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#FF7900" : "#CC6100";
      ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
    });
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }

  function start() {
    reset();
    draw();
    running = true;
    paused = false;
    overlay.classList.add("hidden");
    restartTimer();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      showOverlay("Paused", "Press Space or click Resume.", "Resume");
    } else {
      overlay.classList.add("hidden");
      restartTimer();
    }
  }

  function showOverlay(title, text, button) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    startBtn.textContent = button;
    overlay.classList.remove("hidden");
  }

  async function gameOver(won = false) {
    clearInterval(timer);
    running = false;
    draw();
    showOverlay(won ? "You win!" : "Game over", `Score: ${score}`, "Play again");

    try {
      const res = await fetch("/api/score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ score }),
      });
      const data = await res.json();
      bestEl.textContent = data.best;
      if (data.record && score > 0) {
        overlayText.textContent = `Score: ${score} · New best for pod ${data.pod}!`;
      }
    } catch (e) {
      /* server unreachable: the game still works offline */
    }
  }

  // ---------- Controls ----------

  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right",
    z: "up", q: "left", Z: "up", Q: "left", // AZERTY
  };

  document.addEventListener("keydown", e => {
    if (e.key === " ") {
      e.preventDefault();
      if (!running) start(); else togglePause();
      return;
    }
    if (e.key === "Enter" && !running) { start(); return; }
    const name = KEYS[e.key];
    if (name) {
      e.preventDefault();
      if (running && !paused) turn(name);
    }
  });

  startBtn.addEventListener("click", () => {
    if (running && paused) togglePause(); else start();
  });

  let touchStart = null;
  const board = document.getElementById("board");
  board.addEventListener("touchstart", e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  board.addEventListener("touchend", e => {
    if (!touchStart || !running || paused) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    touchStart = null;
  });

  // ---------- Server info (shows which pod answered) ----------

  async function loadInfo() {
    const dot = document.getElementById("status-dot");
    try {
      const [info, best] = await Promise.all([
        fetch("/api/info").then(r => r.json()),
        fetch("/api/score").then(r => r.json()),
      ]);
      document.getElementById("pod").textContent = info.pod;
      document.getElementById("version").textContent = info.version;
      bestEl.textContent = best.best;
      dot.className = "dot ok";
    } catch (e) {
      document.getElementById("pod").textContent = "unreachable";
      dot.className = "dot ko";
    }
  }

  reset();
  draw();
  loadInfo();
})();
</script>
</body>
</html>
